<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- CSS -->
	<link rel="stylesheet" href="./src/css/output.css" />
	<!-- FONT AWESOME -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
		integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- REMIX ICON -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
		integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
		crossorigin="anonymous" referrerpolicy="no-referrer"
	/>
	<!-- titre -->
	<title>Inscription | AutoCar</title>
</head>

<body class="min-h-screen flex items-center justify-center bg-black">

	<div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-40"
		style="background-image: url('/img/register-bg.jpg');">
	</div>

	<div
		class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-lg border border-white/20">

		<!-- Title -->
		<h2 class="text-3xl text-white font-bold text-center mb-6">
			Créez votre compte
		</h2>

		<form class="space-y-4">

			<div>
				<label class="text-white font-medium">Nom complet</label>
				<input type="text"
					class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500">
			</div>

			<div>
				<label class="text-white font-medium">Email</label>
				<input type="email"
					class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500">
			</div>

			<div>
				<label class="text-white font-medium">Mot de passe</label>
				<input type="password"
					class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500">
			</div>

			<div>
				<label class="text-white font-medium">Confirmer le mot de passe</label>
				<input type="password"
					class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500">
			</div>

			<button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition">
				S'inscrire
			</button>

			<p class="text-center text-gray-200 mt-3">
				Déjà un compte ?
				<a href="login.html" class="text-blue-400 hover:underline">Se connecter</a>
			</p>

		</form>
	</div>

</body>
<script src="https://cdn.tailwindcss.com"></script>

</html>
