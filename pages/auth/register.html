<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- CSS -->
        <link rel="stylesheet" href="/src/css/output.css" />
        <!-- FONT AWESOME -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <!-- REMIX ICON -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
            integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <!-- titre -->
        <title>Inscription | AutoCar</title>
    </head>

    <body class="min-h-screen flex items-center justify-center bg-black">
        <div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-40" style="background-image: url('/img/register-bg.jpg')"></div>

        <div class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-lg border border-white/20">
            <!-- Title -->
            <h2 class="text-3xl text-white font-bold text-center mb-6">Créez votre compte</h2>

            <form action="#" class="space-y-4" id="form_register">
                <!-- username -->
                <div>
                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500"
                        autocomplete="off"
                    />
                    <span id="username_error" class="text-red-500"></span>
                </div>

                <!-- email -->
                <div>
                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500"
                        autocomplete="off"
                    />
                    <span id="email_error" class="text-red-500"></span>
                </div>

                <!-- password -->
                <div class="relative w-full">
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <!-- icône de l'oeil -->
                    <img
                        id="afficher_password"
                        src="/img/visibility_eye.svg"
                        alt="Show/Hide"
                        class="w-6 h-6 absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer opacity-70 hover:opacity-100"
                    />
                    <span id="password_error" class="text-red-500"></span>
                </div>

                <!-- confirmation password -->
                <div class="relative w-full">
                    <input
                        type="password"
                        id="confirm_password"
                        placeholder="Confirm password"
                        class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 outline-none focus:ring-2 focus:ring-blue-500"
                    />
                    <!-- icône de l'oeil -->
                    <img
                        id="afficher_confirm_password"
                        src="/img/visibility_eye.svg"
                        alt="Show/Hide"
                        class="w-6 h-6 absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer opacity-70 hover:opacity-100"
                    />
                    <span id="confirm_password_error" class="text-red-600"></span>
                </div>

                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition" type="submit">
                    S'inscrire
                </button>

                <p class="text-center text-gray-200 mt-3">
                    Déjà un compte ?
                    <a href="login.html" class="text-blue-400 hover:underline">Se connecter</a>
                </p>
            </form>
        </div>

        <script src="https://cdn.tailwindcss.com"></script>
        <script src="/src/js/auth/register.js"></script>
    </body>
</html>
