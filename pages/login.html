<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- CSS -->
	<link rel="stylesheet" href="./src/css/output.css" />
	<!-- FONT AWESOME -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
		integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- REMIX ICON -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
		integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- titre -->
	<title>Connexion | AutoCar</title>
</head>

<body class="min-h-screen bg-black">

	<div class="grid grid-cols-1 lg:grid-cols-4 min-h-screen">

		<!-- IMAGE (3/4) -->
		<div class="lg:col-span-3 bg-cover bg-center" style="background-image: url('/img/login-bg.jpg');">
		</div>

		<!-- FORMULAIRE (1/4) -->
		<div class="lg:col-span-1 flex items-center justify-center bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-lg border border-white/20">

			<div class="w-full max-w-sm text-white">
				<h2 class="text-3xl font-bold mb-6 text-center">Connexion</h2>

				<form class="space-y-5">

					<div>
						<label class="font-medium">Email</label>
						<input type="email"
							class="w-full mt-1 p-3 rounded-lg bg-white/10 text-white outline-none focus:ring-2 focus:ring-blue-500">
					</div>

					<div>
						<label class="font-medium">Mot de passe</label>
						<input type="password"
							class="w-full mt-1 p-3 rounded-lg bg-white/10 text-white outline-none focus:ring-2 focus:ring-blue-500">
					</div>

					<button class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-lg font-semibold transition">
						Se connecter
					</button>

				</form>

				<p class="text-center text-gray-300 mt-4">
					Pas de compte ?
					<a href="register.html" class="text-blue-400 hover:underline">Créer un compte</a>
				</p>

			</div>

		</div>
	</div>

</body>
<script src="https://cdn.tailwindcss.com"></script>

</html>
